# Prefix (matches Herdr)
unbind C-b
set -g prefix `
bind ` send-prefix

# Window navigation
bind -n S-Left previous-window
bind -n S-Right next-window
bind h previous-window
bind l next-window
bind S-l switch-client -p
bind S-h switch-client -n

# Herdr-equivalent tab actions
bind-key n display-popup -E -w 40 -h 5 -b rounded -d "#{pane_current_path}" "bash -c '
    read -r -p \"New window name: \" new_name;
    [[ -n \"\$new_name\" ]] && tmux new-window -n \"\$new_name\" -c \"\$PWD\"
'"
bind-key , display-popup -E -w 40 -h 5 -b rounded "bash -c '
    read -p \"Rename window to: \" new_name;
    [[ -n \"\$new_name\" ]] && tmux rename-window \"\$new_name\"
'"
bind r source-file ~/.config/tmux/tmux.conf

# Pane splits: backslash = vertical divider; minus = horizontal divider
unbind '"'
unbind %
bind '\' split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind k kill-pane # skip confirmation prompt
bind x kill-window

# Prefix+R enters pane-resize mode. Use vim keys; q or Escape exits.
bind R switch-client -T pane-resize
bind-key -T pane-resize h resize-pane -L 5 \; switch-client -T pane-resize
bind-key -T pane-resize j resize-pane -D 5 \; switch-client -T pane-resize
bind-key -T pane-resize k resize-pane -U 5 \; switch-client -T pane-resize
bind-key -T pane-resize l resize-pane -R 5 \; switch-client -T pane-resize
bind-key -T pane-resize q switch-client -T root
bind-key -T pane-resize Escape switch-client -T root

# Vi-style copy mode
set-window-option -g mode-keys vi
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel

# Sesh keybinds
bind-key "o" run-shell "sesh connect \"$(
  sesh list --icons | fzf-tmux -p 80%,70% \
    --no-sort --ansi --border-label ' sesh ' --prompt '⚡  ' \
    --header '  ^a all ^t tmux ^g configs ^x zoxide ^d tmux kill ^f find' \
    --bind 'tab:down,btab:up' \
    --bind 'ctrl-a:change-prompt(⚡  )+reload(sesh list --icons)' \
    --bind 'ctrl-t:change-prompt(🪟  )+reload(sesh list -t --icons)' \
    --bind 'ctrl-g:change-prompt(⚙️  )+reload(sesh list -c --icons)' \
    --bind 'ctrl-x:change-prompt(📁  )+reload(sesh list -z --icons)' \
    --bind 'ctrl-f:change-prompt(🔎  )+reload(fd -H -d 2 -t d -E .Trash . ~)' \
    --bind 'ctrl-d:execute(tmux kill-session -t {2..})+change-prompt(⚡  )+reload(sesh list --icons)' \
    --preview-window 'right:55%' \
    --preview 'sesh preview {}'
)\""
bind-key "W" run-shell "sesh window connect \"$(sesh window list | fzf-tmux -p 60%,50% --prompt '🪟  ')\""
bind-key "K" display-popup -h 90% -w 50% -E "sesh picker -i"
