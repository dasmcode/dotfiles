# Top-level project fields.
name = "voice-vrm"                                      # required: the workspace label
group = "ICICI"
description = "dev project to transcribe and extract meaningful insights from currency exchange call recordings"             # shown in the browser
working_dir = "${HOME}/Documents/voice-vrm/"    # ~ and $VARS expand

[[tabs]]
name = "app"                                            # required: the tab label
command = "cd ./dev && source .venv/bin/activate && nvim" # runs on startup

[[tabs]]
name = "frontend"                                            # required: the tab label
command = "cd ./frontend && nvim" # runs on startup

[[tabs]]
name = "pi"

[[tabs.panes]]
command = "pi"

[[tabs.panes]]
command = "ll"
split = "right"

[[tabs]]
name = "docker-comp"
command = "ll"

[[tabs]]
name = "terminal"                                          # no command — just an empty shell
command = "ll"

