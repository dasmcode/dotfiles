general {
    lock_cmd = quickshell --no-duplicate --path /home/meli/.config/quickshell/lockscreen
    before_sleep_cmd = quickshell --no-duplicate --path /home/meli/.config/quickshell/lockscreen
    after_sleep_cmd = hyprctl dispatch dpms on
}

# Lock after 5 minutes idle.
listener {
    timeout = 300
    on-timeout = quickshell --no-duplicate --path /home/meli/.config/quickshell/lockscreen
}

# Suspend after 15 minutes idle (10 minutes after locking).
listener {
    timeout = 900
    on-timeout = systemctl suspend
}
